services:
  - type: web
    name: api
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production   # override to "staging" in the stage project
      - key: DATABASE_URL
        sync: false         # set manually in Render dashboard (from Supabase)
      - key: PORT
        value: 3000